<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Java 游戏</title>
    <link rel="stylesheet" href="./platform-tokens.css" />
    <link rel="stylesheet" href="./java-player.css" />
    <link rel="stylesheet" href="./platform-cursor.css" />
    <script defer src="https://cjrtnc.leaningtech.com/4.3/loader.js"></script>
    <script type="module" src="./java-player.js"></script>
  </head>
  <body class="desktop-shell">
    <section id="player-feedback" aria-label="运行状态" hidden>
      <p id="player-status" role="status"></p>
      <button id="retry-start" type="button" hidden>重试</button>
    </section>
    <main id="player-viewport" aria-label="游戏画面">
      <div id="java-display"></div>
    </main>
    <template id="pvz-menu-template">
      <div id="pvz-menu-entries" hidden>
        <button type="button" data-pvz-entry="adventure" aria-label="冒险模式"></button>
        <button type="button" data-pvz-entry="almanac" aria-label="图鉴"></button>
      </div>
      <section id="pvz-menu-loading" aria-labelledby="pvz-loading-title" hidden>
        <div class="pvz-loading-panel">
          <h1 id="pvz-loading-title"></h1>
          <span class="pvz-loading-spinner" aria-hidden="true"></span>
          <p id="pvz-loading-detail" role="status"></p>
        </div>
      </section>
    </template>
  </body>
</html>
