
security:
  jwt:
    secret-key: ${JWT_SECRET}
    expiration-time: 86400000
server:
  port: 22222
  compression:
    # 页面脚本和样式体积较大，开启 gzip 后浏览器下载量明显减少
    enabled: true
spring:
  config:
    import: optional:classpath:application-local.properties
  application:
    name: java-server
  datasource:
    # 第 02 组使用课程分配的在线数据库。
    url: jdbc:mysql://202.194.14.120:3306/java_1_02?allowPublicKeyRetrieval=true&useSSL=false
    username: java_1_02
    password: ${DB_PASSWORD}
#    url: jdbc:mysql://202.194.14.120:3306/java_db?allowPublicKeyRetrieval=true&useSSL=false
#    username: java_server
#    password: ${DB_PASSWORD}
#    url: jdbc:mysql://202.194.14.120:3306/java_1_01?allowPublicKeyRetrieval=true&useSSL=false
#    username: java_1_01
#    password: ${DB_PASSWORD}
    hikari:
      minimum-idle: 1
      maximum-pool-size: 2
  jpa:
#    hibernate.ddl-auto: update
  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 200MB
  jmx:
    enabled: false
  http:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
attach:
  folder: /teach-2025/
logging:
  config: classpath:loggback.xml
app:
  ai:
    api-key: ${DASHSCOPE_API_KEY:}
    # 每个后端实例的并发请求总数上限，同一账号可使用多个对话名额
    max-concurrent: 5
    # 单个账号每分钟最多调用次数
    account-minute-limit: 8
    # 同一连接来源每分钟最多调用次数
    ip-minute-limit: 20
    # 当前后端实例每分钟最多调用次数
    global-minute-limit: 60
    # 单个账号每天最多调用次数，按北京时间切换日期
    account-daily-limit: 40
    # 共用用量文件的后端每天最多调用次数
    global-daily-limit: 500
    # 每日用量保存在本机，重启后继续计数
    quota-file: runtime/ai-usage.json
    # AI 入口接受的请求体字节上限
    request-byte-limit: 16384
    # 同一连接来源每分钟最多访问 AI 入口次数，包含无效请求
    ip-attempt-limit: 60
  # 默认允许本机检查切号，远程和代理请求仍由接口拒绝，部署时可以显式关闭
  local-account-switch: ${LOCAL_ACCOUNT_SWITCH:true}
  # 演示模式：免密切号接口对任意来源开放，登录页显示一键进入按钮；默认开启，正式环境用 DEMO_MODE=false 关闭
  demo-mode: ${DEMO_MODE:true}
